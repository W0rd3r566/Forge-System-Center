name: Native builds and releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build \${{ matrix.name }}
    runs-on: \${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            slug: windows-x64
          - name: Windows ARM64
            runner: windows-11-arm
            slug: windows-arm64
          - name: Linux x86_64
            runner: ubuntu-22.04
            slug: linux-x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
          - name: macOS Intel
            runner: macos-15-intel
            slug: macos-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            slug: macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime and package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xkb1 libxcb-util1 rpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.12,<7"

      - name: Compile source and run unit tests
        run: |
          python -m compileall -q forge run.py scripts
          python -m unittest discover -s tests -v

      - name: Initialize the GUI without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from forge.app import ForgeWindow; app = QApplication([]); window = ForgeWindow(); print('Forge UI initialized'); window.close()"

      - name: Build native executable
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: python scripts/build_binary.py

      - name: Create platform packages
        run: python scripts/package_release.py

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-package-\${{ matrix.slug }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: forge-package-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release and attach all binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
