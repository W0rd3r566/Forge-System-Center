name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test \${{ matrix.name }}
    runs-on: \${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            architecture: x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - name: Windows x64
            runner: windows-latest
            architecture: x64
          - name: Windows ARM64
            runner: windows-11-arm
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            architecture: x64
          - name: macOS Apple Silicon
            runner: macos-latest
            architecture: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xkb1 libxcb-util1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q forge run.py scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Initialize GUI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from forge.app import ForgeWindow; app = QApplication([]); window = ForgeWindow(); print('Forge UI initialized'); window.close()"
