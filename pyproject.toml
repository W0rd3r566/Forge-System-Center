[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-system-center"
version = "0.2.0"
description = "Local-first desktop system utility for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.10,<7", "psutil>=5.9,<8"]

[tool.setuptools]
packages = ["forge"]
